name: Source maintenance review
on:
  schedule:
    - cron: '15 8 1 * *'
  workflow_dispatch:
  pull_request:
    paths: [data-maintenance.json, scripts/check-data-freshness.mjs, website/src/features/housing/taxes.ts]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: node scripts/check-data-freshness.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: source-review
          path: artifacts/data-maintenance/review.json
