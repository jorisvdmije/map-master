name: Dependency audit

on:
  schedule:
    - cron: '35 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - website/package.json
      - website/package-lock.json
      - .github/workflows/dependency-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci --ignore-scripts --no-audit
      - run: npm ci --prefix website --ignore-scripts --no-audit
      - run: mkdir -p artifacts/dependency-audit
      - name: Audit library tooling and runtime dependencies
        run: npm audit --json > artifacts/dependency-audit/library.json
      - name: Audit website tooling and runtime dependencies
        if: ${{ !cancelled() }}
        run: npm audit --prefix website --json > artifacts/dependency-audit/website.json
      - name: Audit library production dependencies
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --json > artifacts/dependency-audit/library-production.json
      - name: Audit website production dependencies
        if: ${{ !cancelled() }}
        run: npm audit --prefix website --omit=dev --json > artifacts/dependency-audit/website-production.json
      - name: Retain advisory reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-audit
          path: artifacts/dependency-audit/
          if-no-files-found: ignore
          retention-days: 30
