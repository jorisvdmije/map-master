name: Browser compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace (${{ matrix.browser }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Check candidate workspace on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:compatibility -- ${{ matrix.browser }}
        env:
          GEO_COMPAT_HEADED: '1'
      - name: Check candidate workspace on macOS
        if: runner.os == 'macOS'
        run: npm run test:compatibility -- ${{ matrix.browser }}
      - name: Check published workspace on Linux
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: xvfb-run -a npm run test:compatibility:published -- ${{ matrix.browser }}
        env:
          GEO_COMPAT_HEADED: '1'
      - name: Check published workspace on macOS
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: npm run test:compatibility:published -- ${{ matrix.browser }}
      - run: npm ci --prefix website
      - name: Build playground export
        run: npm run build:docs
        env:
          NEXT_PUBLIC_BASE_PATH: /map-master
      - name: Check playground mobile layout and resizing on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm --prefix website run check:playground -- ${{ matrix.browser }}
        env:
          GEO_COMPAT_HEADED: '1'
      - name: Check playground mobile layout and resizing on macOS
        if: runner.os == 'macOS'
        run: npm --prefix website run check:playground -- ${{ matrix.browser }}
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-compatibility-${{ matrix.browser }}-${{ matrix.os }}
          path: |
            artifacts/browser-compatibility/
            artifacts/published-workspace/
            artifacts/playground/
          if-no-files-found: ignore
          retention-days: 14
