name: Browser compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace (${{ matrix.browser }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Check candidate workspace on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:compatibility -- ${{ matrix.browser }}
        env:
          GEO_COMPAT_HEADED: '1'
      - name: Check candidate workspace on macOS
        if: runner.os == 'macOS'
        run: npm run test:compatibility -- ${{ matrix.browser }}
      - name: Check published workspace on Linux
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: xvfb-run -a npm run test:compatibility:published -- ${{ matrix.browser }}
        env:
          GEO_COMPAT_HEADED: '1'
      - name: Check published workspace on macOS
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: npm run test:compatibility:published -- ${{ matrix.browser }}
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-compatibility-${{ matrix.browser }}-${{ matrix.os }}
          path: |
            artifacts/browser-compatibility/
            artifacts/published-workspace/
          if-no-files-found: ignore
          retention-days: 14
